[package]
name = "bench-egui"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["syntect"] }
egui_commonmark = { version = "0.26.0", features = ["better_syntax_highlighting"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
